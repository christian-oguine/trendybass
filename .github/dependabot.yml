version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before taking new versions, so malicious releases are caught first.
    cooldown:
      default-days: 7
    groups:
      nuxt:
        patterns: ["nuxt", "@nuxt/*", "@nuxtjs/*", "nuxt-*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
